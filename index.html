<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edictionary</title>
    <style href="style.css", styletype="stylesheet"></style>
</head>
<body>
    <h1>welcome to Edictionary</h1>
    <form id="searchForm">
        <label for="search-input">enter your word</label>
        <input type="search" id="search-input" placeholder="search for a word"
         required>
           <button type="submit">search</button>
    </form>
  
    <br>
    <section id="results">
        
    <h2 id="word"></h2>

    <h3>Noun</h3>
    <p id="noun"></p>

    <h3>Verb</h3>
    <p id="verb"></p>

    <h3>Origin</h3>
    <p id="origin"></p>

    <h3>Pronunciation</h3>
    <p id="pronunciation"></p>

        

        <!-- audio playback -->
         <audio id="audio" controls>your browser does not support audio playback</audio>
    </section>

    <script src="./index.js"></script>
    
</body>
</html>
